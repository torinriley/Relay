# Author: Torin Etheridge
# Date: 2026-10-04
[package]
name = "relay-queue"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A compact, durable, at-least-once distributed job queue"
default-run = "relay"
authors = ["Torin Etheridge"]

[lib]
name = "relay"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/bin/relay.rs"

[[bin]]
name = "relay-bench"
path = "src/bin/relay-bench.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
